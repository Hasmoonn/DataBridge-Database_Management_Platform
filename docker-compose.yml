services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: databridge_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: databridge_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped